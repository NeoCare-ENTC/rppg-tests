BASE: ['']
TOOLBOX_MODE: "train_and_test"  # "train_and_test"  or "only_test"
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 10
  LR: 1e-4
  MODEL_FILE_NAME: NBHR_NBHR_VideoPulse_physnet_diffnormalized
  PLOT_LOSSES_AND_LR: True
  DATA:
    FS: 30
    DATASET: NBHR
    DO_PREPROCESS: True            # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: "/srv/data/rPPG_datasets/NBHR"                     # Raw dataset path (contains Video/ and PPG/ folders)
    CACHED_PATH: "/srv/data/YU/rppg-tests/PreprocessedData/NBHR_physnet/train"    # Processed dataset save path
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 0.8
    FILTERING:
      USE_EXCLUSION_LIST: False
      EXCLUSION_LIST: ['']
      SELECT_TASKS: False
      TASK_LIST: ['']
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']         #if use physnet, should be DiffNormalized
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 128                 #only support for factor of 512
      USE_PSUEDO_PPG_LABEL: False
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'YOLO-Region'    # YOLO-Region for neonatal region extraction, YOLOv5 for face, HC for Haar Cascade, RF for RetinaFace
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: True
          DYNAMIC_DETECTION_FREQUENCY : 1
          USE_MEDIAN_FACE_BOX: True    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 72
        W: 72
VALID:
  DATA:
    FS: 30
    DATASET: NBHR
    DO_PREPROCESS: True               # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: "/srv/data/rPPG_datasets/NBHR"                     # Raw dataset path (contains Video/ and PPG/ folders)
    CACHED_PATH: "/srv/data/YU/rppg-tests/PreprocessedData/NBHR_physnet/val"    # Processed dataset save path
    EXP_DATA_NAME: ""
    BEGIN: 0.8
    END: 1.0
    FILTERING:
      USE_EXCLUSION_LIST: False
      EXCLUSION_LIST: ['']
      SELECT_TASKS: False
      TASK_LIST: ['']
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']         #if use physnet, should be DiffNormalized
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 128                 #only support for factor of 512
      USE_PSUEDO_PPG_LABEL: False
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'YOLO-Region'    # YOLO-Region for neonatal region extraction, YOLOv5 for face, HC for Haar Cascade, RF for RetinaFace
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: True
          DYNAMIC_DETECTION_FREQUENCY : 1
          USE_MEDIAN_FACE_BOX: True    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 72
        W: 72
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: False                   # to use provided validation dataset to find the best epoch, should be false
  DATA:
    FS: 30
    DATASET: VideoPulse
    DO_PREPROCESS: True                 # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: "/srv/videopulsedataset"                     # Raw dataset path (contains Video/ and PPG/ folders)
    CACHED_PATH: "/srv/data/YU/rppg-tests/PreprocessedData/VideoPulse_physnet/test"    # Processed dataset save path
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 1.0
    FILTERING:
      USE_EXCLUSION_LIST: False
      EXCLUSION_LIST: ['']
      SELECT_TASKS: False
      TASK_LIST: ['']
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']         #if use physnet, should be DiffNormalized
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 128                 #only support for factor of 512
      USE_PSUEDO_PPG_LABEL: False
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'YOLO-Region'    # YOLO-Region for neonatal region extraction, YOLOv5 for face, HC for Haar Cascade, RF for RetinaFace
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: True
          DYNAMIC_DETECTION_FREQUENCY : 1
          USE_MEDIAN_FACE_BOX: True    # This should be used ONLY if dynamic detection is used
      RESIZE:
        H: 72
        W: 72
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  DROP_RATE: 0.2
  NAME: Physnet
  PHYSNET:
    FRAME_NUM: 128
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"        # "FFT" or "peak detection"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False        # Change this if you'd like an evaluation window smaller than the test video length
    WINDOW_SIZE: 10        # In seconds
  MODEL_PATH: ""